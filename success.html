<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHMONEYSZN | Success</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
    }
    
    .flag-container {
      width: 150px;
      height: 150px;
      margin-bottom: 2rem;
      position: relative;
    }
    
    .realistic-flag {
      width: 100%;
      height: 100%;
      background-color: #000;
      background-image: url('logo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    
    .desc-container {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .success-text {
      color: #FFD700;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
    }

    p.description {
      color: #555;
      font-size: 1.1rem;
      max-width: 450px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .back-btn {
      padding: 15px 30px;
      border-radius: 0;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      text-decoration: none;
      transition: 0.2s;
    }
    .back-btn:hover {
      background: red;
      border-color: red;
      box-shadow: 4px 4px 0 #000;
    }
  </style>
</head>
<body>
  <div class="flag-container">
    <div class="realistic-flag"></div>
  </div>
  
  <h1>SHMONEYSZN</h1>
  
  <div class="desc-container">
    <div class="success-text">YOU ARE LOCKED IN.</div>
    <p class="description">Your email has been added to the crew. Keep an eye out for updates.</p>
  </div>
  
  <a href="index.html" class="back-btn">RETURN TO HUB</a>
</body>
</html>
