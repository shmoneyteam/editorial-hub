<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHMONEYSZN | Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .pirate-flag {
      width: 120px;
      height: auto;
      margin-bottom: 2rem;
      image-rendering: pixelated;
      cursor: crosshair;
      animation: wave 2s infinite ease-in-out;
    }
    @keyframes wave {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .pirate-flag:hover {
      animation: shake 0.3s infinite;
    }
    @keyframes shake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(0px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(2px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(2px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .desc-container {
      height: 60px;
      margin-bottom: 2rem;
    }
    p.description {
      color: #555;
      font-size: 1.1rem;
      max-width: 450px;
      line-height: 1.5;
    }
    .danger-text {
      display: none;
      color: red;
      font-weight: bold;
      font-size: 1.5rem;
      margin-top: 10px;
      animation: blink 1s infinite;
    }
    .pirate-flag:hover ~ .desc-container .danger-text {
      display: block;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      z-index: 10;
    }
    input[type="email"] {
      padding: 15px;
      border-radius: 0;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      font-size: 1rem;
      font-family: inherit;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: red;
      box-shadow: 4px 4px 0 red;
    }
    button {
      padding: 15px;
      border-radius: 0;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      transition: 0.2s;
    }
    button:hover {
      background: red;
      border-color: red;
      box-shadow: 4px 4px 0 #000;
    }
  </style>
</head>
