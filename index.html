<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHMONEYSZN | Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
    }
    
    /* FLUID WAVING FLAG CSS */
    .flag-container {
      width: 150px;
      height: 150px;
      margin-bottom: 2rem;
      position: relative;
      cursor: crosshair;
    }
    
    .realistic-flag {
      width: 100%;
      height: 100%;
      background-color: #000;
background-image: url('logo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      
      transform-origin: left center;
      animation: windWave 2.5s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite alternate;
    }
    
    .realistic-flag::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(0,0,0,0.1) 100%);
      animation: lightingShift 2.5s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite alternate;
    }

    @keyframes windWave {
      0% { transform: perspective(600px) rotateY(15deg) skewY(-3deg); }
      100% { transform: perspective(600px) rotateY(-15deg) skewY(3deg); }
    }
    
    @keyframes lightingShift {
      0% { background-position: -50px 0; }
      100% { background-position: 50px 0; }
    }

    .realistic-flag:hover {
      animation: violentShake 0.2s infinite;
    }
    
    @keyframes violentShake {
      0% { transform: translate(2px, 1px) rotate(0deg) scale(1.05); border-color: red; }
      25% { transform: translate(-3px, -2px) rotate(-2deg) scale(1.05); }
      50% { transform: translate(3px, 2px) rotate(2deg) scale(1.05); }
      75% { transform: translate(-2px, -1px) rotate(-1deg) scale(1.05); }
      100% { transform: translate(1px, 2px) rotate(1deg) scale(1.05); }
    }

    .desc-container {
      height: 60px;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* NEW GOLD SPINNING TEXT */
    .gold-money {
      color: #FFD700;
      font-size: 3rem;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
      display: inline-block;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .danger-text {
      display: none;
      color: red;
      font-weight: bold;
      font-size: 1.5rem;
      margin-top: 10px;
      animation: blink 1s infinite;
    }
    
    .flag-container:hover ~ .desc-container .danger-text {
      display: block;
    }
    
    .flag-container:hover ~ .desc-container .gold-money {
      display: none; /* Hides the $$$ when the danger text shows */
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      z-index: 10;
    }
    input[type="email"] {
      padding: 15px;
      border-radius: 0;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      font-size: 1rem;
      font-family: inherit;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: red;
      box-shadow: 4px 4px 0 red;
    }
    button {
      padding: 15px;
      border-radius: 0;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      transition: 0.2s;
    }
    button:hover {
      background: red;
      border-color: red;
      box-shadow: 4px 4px 0 #000;
    }
  </style>
</head>
<body>
  <div class="flag-container">
    <div class="realistic-flag"></div>
  </div>
  
  <h1>SHMONEYSZN</h1>
  
  <div class="desc-container">
    <div class="gold-money">$$$</div>
    <div class="danger-text">⚠ DANGER ⚠</div>
  </div>
  
  <form class="signup-form" action="https://api.web3forms.com/submit" method="POST">
    <!-- Paste your Web3Forms access key below -->
    <input type="hidden" name="access_key" value="0260d308-f469-4a2b-87db-7854c260df65">
    <input type="email" name="email" placeholder="Enter your email address" required>
    <button type="submit">NOTIFY ME</button>
  </form>
</body>
</html>
